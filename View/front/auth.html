<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechCare - Connexion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tabs {
            display: flex;
            background: #f7fafc;
            border-bottom: 2px solid #e2e8f0;
        }

        .tab-btn {
            flex: 1;
            padding: 18px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            background: none;
            cursor: pointer;
            transition: all 0.3s;
            color: #718096;
        }

        .tab-btn.active {
            color: #667eea;
            background: white;
            border-bottom: 3px solid #667eea;
        }

        .tab-btn:hover:not(.active) {
            background: #edf2f7;
            color: #4a5568;
        }

        .form-container {
            padding: 40px;
        }

        .form {
            display: none;
            animation: slideIn 0.3s ease;
        }

        .form.active {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        h2 {
            color: #2d3748;
            margin-bottom: 25px;
            font-size: 28px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            outline: none;
            font-family: inherit;
        }

        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-weight: 500;
            font-size: 14px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            display: none;
            font-size: 14px;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .password-hint {
            font-size: 12px;
            color: #718096;
            margin-top: 5px;
        }

        hr {
            margin: 20px 0;
            border: none;
            border-top: 1px solid #e2e8f0;
        }

        @media (max-width: 600px) {
            .form-container {
                padding: 25px;
            }
            
            .tab-btn {
                padding: 15px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')">🔐 Se connecter</button>
            <button class="tab-btn" onclick="switchTab('register')">📝 Créer un compte</button>
        </div>

        <div class="form-container">
            <!-- FORMULAIRE LOGIN -->
            <div id="login-form" class="form active">
                <h2>Connexion</h2>
                <form action="../../Controller/UserController.php?action=login" method="POST" onsubmit="return validateLogin()">
                    <div class="input-group">
                        <label>📧 Email</label>
                        <input type="email" name="email" id="login-email" placeholder="exemple@email.com" required>
                    </div>
                    <div class="input-group">
                        <label>🔒 Mot de passe</label>
                        <input type="password" name="password" id="login-password" placeholder="Votre mot de passe" required>
                    </div>
                    <button type="submit" class="btn-submit">Se connecter</button>
                </form>
                <div id="login-message" class="message"></div>
            </div>

            <!-- FORMULAIRE REGISTER -->
            <div id="register-form" class="form">
                <h2>Créer un compte</h2>
                <form action="../../Controller/UserController.php?action=register" method="POST" onsubmit="return validateRegister()">
                    <div class="input-group">
                        <label>👤 Nom</label>
                        <input type="text" name="nom" id="reg-nom" placeholder="Votre nom" required>
                    </div>
                    <div class="input-group">
                        <label>👤 Prénom</label>
                        <input type="text" name="prenom" id="reg-prenom" placeholder="Votre prénom" required>
                    </div>
                    <div class="input-group">
                        <label>📧 Email</label>
                        <input type="email" name="email" id="reg-email" placeholder="exemple@email.com" required>
                    </div>
                    <div class="input-group">
                        <label>📞 Téléphone</label>
                        <input type="tel" name="telephone" id="reg-telephone" placeholder="06 12 34 56 78" required>
                    </div>
                    <div class="input-group">
                        <label>🔒 Mot de passe</label>
                        <input type="password" name="password" id="reg-password" placeholder="Minimum 8 caractères" required>
                        <div class="password-hint">⚠️ Le mot de passe doit contenir au moins 8 caractères</div>
                    </div>
                    <div class="input-group">
                        <label>🔒 Confirmer le mot de passe</label>
                        <input type="password" id="reg-confirm-password" placeholder="Retapez votre mot de passe" required>
                    </div>
                    <button type="submit" class="btn-submit">S'inscrire</button>
                </form>
                <div id="register-message" class="message"></div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            // Changer l'apparence des boutons
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(btn => btn.classList.remove('active'));
            
            if (tab === 'login') {
                tabs[0].classList.add('active');
                document.getElementById('login-form').classList.add('active');
                document.getElementById('register-form').classList.remove('active');
                // Cacher les messages
                document.getElementById('login-message').style.display = 'none';
            } else {
                tabs[1].classList.add('active');
                document.getElementById('register-form').classList.add('active');
                document.getElementById('login-form').classList.remove('active');
                // Cacher les messages
                document.getElementById('register-message').style.display = 'none';
            }
        }

        function validateLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const messageDiv = document.getElementById('login-message');
            
            if (!email || !password) {
                messageDiv.textContent = '❌ Veuillez remplir tous les champs';
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
                return false;
            }
            
            if (!email.includes('@')) {
                messageDiv.textContent = '❌ Email invalide';
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
                return false;
            }
            
            messageDiv.style.display = 'none';
            return true;
        }

        function validateRegister() {
            const nom = document.getElementById('reg-nom').value;
            const prenom = document.getElementById('reg-prenom').value;
            const email = document.getElementById('reg-email').value;
            const telephone = document.getElementById('reg-telephone').value;
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;
            const messageDiv = document.getElementById('register-message');
            
            // Vérifier que tous les champs sont remplis
            if (!nom || !prenom || !email || !telephone || !password || !confirmPassword) {
                messageDiv.textContent = '❌ Veuillez remplir tous les champs';
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
                return false;
            }
            
            // Vérifier l'email
            if (!email.includes('@')) {
                messageDiv.textContent = '❌ Email invalide';
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
                return false;
            }
            
            // Vérifier la longueur du mot de passe
            if (password.length < 8) {
                messageDiv.textContent = '❌ Le mot de passe doit contenir au moins 8 caractères';
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
                return false;
            }
            
            // Vérifier que les mots de passe correspondent
            if (password !== confirmPassword) {
                messageDiv.textContent = '❌ Les mots de passe ne correspondent pas';
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
                return false;
            }
            
            messageDiv.style.display = 'none';
            return true;
        }
        
        // Afficher les messages d'erreur depuis l'URL (si venant du controller)
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        const success = urlParams.get('success');
        
        if (error === 'login') {
            const messageDiv = document.getElementById('login-message');
            messageDiv.textContent = '❌ Email ou mot de passe incorrect';
            messageDiv.className = 'message error';
            messageDiv.style.display = 'block';
        }
        
        if (success === 'register') {
            const messageDiv = document.getElementById('register-message');
            messageDiv.textContent = '✅ Compte créé avec succès ! Vous pouvez vous connecter';
            messageDiv.className = 'message success';
            messageDiv.style.display = 'block';
            // Basculer vers l'onglet login après 2 secondes
            setTimeout(() => {
                switchTab('login');
            }, 2000);
        }
    </script>
</body>
</html>
